<header>
  <div class="logo">Tuesday<span>ForYou</span></div>
  <div class="header-text">Reaction Time Test</div>
</header>

<main>
  <div class="container">

    <h1>How fast are you?</h1>
    <p class="subtitle">
      Click the box as soon as it turns green.
    </p>

    <div id="reactionBox">
      <div>
        <div id="message">Click to start</div>
        <div id="subMessage">Wait for the green.</div>
      </div>
    </div>

    <div class="stats">

      <div class="stat">
        <div class="stat-label">Last</div>
        <div class="stat-value" id="lastTime">—</div>
      </div>

      <div class="stat">
        <div class="stat-label">Best</div>
        <div class="stat-value" id="bestTime">—</div>
      </div>

      <div class="stat">
        <div class="stat-label">Attempts</div>
        <div class="stat-value" id="attempts">0</div>
      </div>

    </div>

    <button onclick="resetStats()">Reset Stats</button>

  </div>
</main>

<footer>
  TuesdayForYou © 2026
</footer>

<script>
  const box = document.getElementById("reactionBox");
  const message = document.getElementById("message");
  const subMessage = document.getElementById("subMessage");

  const lastTime = document.getElementById("lastTime");
  const bestTime = document.getElementById("bestTime");
  const attemptsDisplay = document.getElementById("attempts");

  let state = "idle";
  let startTime = 0;
  let timeout;

  let best = localStorage.getItem("tuesdayBest");
  let attempts = Number(localStorage.getItem("tuesdayAttempts")) || 0;

  if (best) {
    bestTime.textContent = best + " ms";
  }

  attemptsDisplay.textContent = attempts;

  box.addEventListener("click", () => {

    // Start
    if (state === "idle" || state === "result") {
      startTest();
      return;
    }

    // Clicked too early
    if (state === "waiting") {
      clearTimeout(timeout);

      state = "result";
      box.className = "";
      box.classList.add("result");

      message.textContent = "Too early!";
      subMessage.textContent = "Click to try again.";

      return;
    }

    // Successful reaction
    if (state === "go") {
      const reaction = Math.round(performance.now() - startTime);

      state = "result";

      box.className = "";
      box.classList.add("result");

      message.textContent = reaction + " ms";

      let rating;

      if (reaction < 180) {
        rating = "INSANE ⚡";
      } else if (reaction < 220) {
        rating = "Excellent!";
      } else if (reaction < 280) {
        rating = "Great reaction!";
      } else if (reaction < 350) {
        rating = "Pretty good!";
      } else if (reaction < 450) {
        rating = "Not bad.";
      } else {
        rating = "You can do better!";
      }

      subMessage.textContent = rating + " Click to try again.";

      lastTime.textContent = reaction + " ms";

      attempts++;
      attemptsDisplay.textContent = attempts;

      localStorage.setItem("tuesdayAttempts", attempts);

      if (!best || reaction < Number(best)) {
        best = reaction;
        bestTime.textContent = reaction + " ms";
        localStorage.setItem("tuesdayBest", reaction);
      }
    }

  });

  function startTest() {
    state = "waiting";

    box.className = "";
    box.classList.add("waiting");

    message.textContent = "WAIT...";
    subMessage.textContent = "Don't click yet!";

    const delay = Math.floor(Math.random() * 3000) + 1500;

    timeout = setTimeout(() => {

      state = "go";

      box.className = "";
      box.classList.add("go");

      message.textContent = "CLICK!";
      subMessage.textContent = "GO GO GO!";

      startTime = performance.now();

    }, delay);
  }

  function resetStats() {
    best = null;
    attempts = 0;

    localStorage.removeItem("tuesdayBest");
    localStorage.removeItem("tuesdayAttempts");

    lastTime.textContent = "—";
    bestTime.textContent = "—";
    attemptsDisplay.textContent = "0";

    state = "idle";

    box.className = "";

    message.textContent = "Click to start";
    subMessage.textContent = "Wait for the green.";
  }
</script>

</body>
</html>
